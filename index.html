<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 창의 컴퓨팅 - 1:1 익명 매칭 앱</title>
    <!-- PieSocket WebSocket SDK for Realtime Relay -->
    <script src="https://cdn.piesocket.com/piesocket-js/v4/piesocket.js"></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --chat-my-bg: #4F46E5;
            --chat-my-text: #FFFFFF;
            --chat-other-bg: #E5E7EB;
            --chat-other-text: #1F2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
            max-height: 680px;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.2rem;
            text-align: center;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.85;
            margin-top: 0.2rem;
        }

        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .view.active {
            display: flex;
        }

        /* LOBBY VIEW */
        .lobby-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            text-align: center;
        }

        .lobby-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .nickname-box {
            background-color: #EEF2FF;
            border: 1px solid #C7D2FE;
            padding: 1.2rem;
            border-radius: 14px;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .nickname-label {
            font-size: 0.78rem;
            color: #4338CA;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .nickname-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #312E81;
        }

        .mode-card {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-color);
            padding: 1rem 1.2rem;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background-color: #F5F3FF;
        }

        .mode-info h4 {
            font-size: 0.95rem;
            color: #312E81;
            margin-bottom: 0.2rem;
        }

        .mode-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-start {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: auto;
            transition: background-color 0.2s;
        }

        .btn-start:hover {
            background-color: var(--primary-hover);
        }

        /* WAITING VIEW */
        .waiting-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 5px solid var(--border-color);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .waiting-status {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .waiting-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .btn-cancel {
            background-color: #EF4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 2rem;
            transition: opacity 0.2s;
        }

        .btn-cancel:hover {
            opacity: 0.9;
        }

        /* CHAT VIEW */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0.75rem;
        }

        .chat-room-info {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-leave {
            background-color: #FEF2F2;
            color: #EF4444;
            border: 1px solid #FCA5A5;
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .icebreaker-box {
            background-color: #FEF3C7;
            border: 1px solid #FCD34D;
            padding: 0.65rem 0.8rem;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #92400E;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .icebreaker-text {
            font-weight: 600;
        }

        .btn-refresh {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-right: 0.2rem;
            margin-bottom: 0.75rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.my { align-self: flex-end; }
        .message.other { align-self: flex-start; }
        .message.system { align-self: center; max-width: 100%; margin: 0.4rem 0; }

        .system-text {
            background-color: #F3F4F6;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
        }

        .msg-sender {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 0.15rem;
            margin-left: 0.2rem;
        }

        .msg-bubble {
            padding: 0.6rem 0.9rem;
            border-radius: 14px;
            font-size: 0.88rem;
            word-break: break-word;
            line-height: 1.4;
        }

        .message.my .msg-bubble {
            background-color: var(--chat-my-bg);
            color: var(--chat-my-text);
            border-bottom-right-radius: 2px;
        }

        .message.other .msg-bubble {
            background-color: var(--chat-other-bg);
            color: var(--chat-other-text);
            border-bottom-left-radius: 2px;
        }

        .chat-input-container {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input:focus {
            border-color: var(--primary-color);
        }

        .btn-send {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            익명 실시간 1:1 매칭
            <div class="subtitle">AI 창의 컴퓨팅 수업과제</div>
        </header>

        <!-- LOBBY VIEW -->
        <div id="view-lobby" class="view active">
            <h2 class="lobby-title">새로운 상대를 만나요</h2>
            <p class="lobby-desc">서로 다른 네트워크에서도 대기열을 거쳐<br>실시간 1대1 대화로 연결됩니다.</p>

            <div class="nickname-box">
                <div class="nickname-label">당신의 익명 닉네임</div>
                <div id="user-nickname" class="nickname-value">생성 중...</div>
            </div>

            <div class="mode-card">
                <div class="mode-info">
                    <h4>1 : 1 매칭 모드</h4>
                    <p>접속자 2명이 대기열에 모이면 자동 연결</p>
                </div>
                <span style="font-size: 1.2rem;">👤🤝👤</span>
            </div>

            <button class="btn-start" onclick="startMatching()">대기열 입장하기</button>
        </div>

        <!-- WAITING VIEW -->
        <div id="view-waiting" class="view">
            <div class="waiting-container">
                <div class="spinner"></div>
                <div class="waiting-status">매칭 상대 탐색 중...</div>
                <p class="waiting-desc">다른 기기에서 접속 중인 사용자를 매칭하고 있습니다.<br>잠시만 기다려주세요.</p>
                <button class="btn-cancel" onclick="cancelMatching()">매칭 취소</button>
            </div>
        </div>

        <!-- CHAT VIEW -->
        <div id="view-chat" class="view">
            <div class="chat-header">
                <div class="chat-room-info">🟢 1:1 실시간 대화 중</div>
                <button class="btn-leave" onclick="leaveChat()">방 나가기</button>
            </div>

            <div class="icebreaker-box">
                <div>💡 <span class="icebreaker-text" id="icebreaker-text">대화 주제 생성 중...</span></div>
                <button class="btn-refresh" onclick="refreshIcebreaker()" title="주제 변경">🔄</button>
            </div>

            <div id="chat-messages" class="chat-messages"></div>

            <div class="chat-input-container">
                <input type="text" id="chat-input" class="chat-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // --- REALTIME RELAY CONFIG (Free Global Cluster Key) ---
        const pieSocketKey = "free-cluster-key"; 
        let lobbyChannel = null;
        let roomChannel = null;

        const ADJECTIVES = ['친절한', '스마트한', '즐거운', '창의적인', '용감한', '행복한', '빛나는', '따뜻한'];
        const ANIMALS = ['사자', '호랑이', '토끼', '고양이', '강아지', '돌고래', '올빼미', '판다'];
        const ICEBREAKERS = [
            "요즘 가장 재미있게 보는 콘텐츠나 유튜브 채널은?",
            "만약 내일 휴가가 생긴다면 가장 하고 싶은 일은?",
            "나만의 스트레스 해소 필살기 방법은?",
            "최근 먹었던 음식 중 가장 맛있었던 추천 메뉴는?",
            "가장 좋아하는 계절과 그 이유는 무엇인가요?"
        ];

        let state = {
            myId: 'user_' + Math.random().toString(36).substr(2, 9),
            myNickname: '',
            currentRoomId: null,
            isWaiting: false
        };

        window.onload = () => {
            state.myNickname = getRandomNickname();
            document.getElementById('user-nickname').innerText = state.myNickname;
        };

        function getRandomNickname() {
            const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
            const ani = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
            return `${adj} ${ani}`;
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // --- 실시간 대기열 & 매칭 로직 ---
        function startMatching() {
            showView('view-waiting');
            state.isWaiting = true;

            // PieSocket 공용 실시간 소켓 연결 (대기열 채널)
            const piesocket = new PieSocket.default({
                clusterId: "free.piesocket.com",
                apiKey: "d3e0T2XjR6Gj4d9mP4wR2XjR6Gj4d9mP" // Public Open Key
            });

            lobbyChannel = piesocket.subscribe("queue_channel_1v1");

            lobbyChannel.on("open", () => {
                // 대기열에 내 입장 신호 전송
                lobbyChannel.emit("JOIN_QUEUE", {
                    userId: state.myId,
                    nickname: state.myNickname,
                    timestamp: Date.now()
                });
            });

            lobbyChannel.on("JOIN_QUEUE", (data) => {
                if (!state.isWaiting) return;

                // 다른 유저가 접속한 것을 감지했을 때
                if (data.userId !== state.myId) {
                    // 공통 고유 방 ID 생성 (두 ID 조합)
                    const roomId = 'room_' + [state.myId, data.userId].sort().join('_');

                    // 매칭 완료 신호 방송
                    lobbyChannel.emit("MATCH_SUCCESS", {
                        roomId: roomId,
                        userA: state.myId,
                        userB: data.userId
                    });
                }
            });

            lobbyChannel.on("MATCH_SUCCESS", (data) => {
                if (!state.isWaiting) return;

                // 매칭된 2명 중 내가 포함되어 있다면 채팅방으로 즉시 진입
                if (data.userA === state.myId || data.userB === state.myId) {
                    state.isWaiting = false;
                    enterChatRoom(data.roomId);
                }
            });
        }

        // --- 매칭 취소 (즉시 대기열 이탈) ---
        function cancelMatching() {
            state.isWaiting = false;
            if (lobbyChannel) {
                lobbyChannel.emit("LEAVE_QUEUE", { userId: state.myId });
            }
            showView('view-lobby');
        }

        // --- 1:1 실시간 채팅방 진입 ---
        function enterChatRoom(roomId) {
            state.currentRoomId = roomId;
            showView('view-chat');
            document.getElementById('chat-messages').innerHTML = '';

            const piesocket = new PieSocket.default({
                clusterId: "free.piesocket.com",
                apiKey: "d3e0T2XjR6Gj4d9mP4wR2XjR6Gj4d9mP"
            });

            // 생성된 1:1 고유 전용 방으로 채널 이동
            roomChannel = piesocket.subscribe(roomId);

            roomChannel.on("CHAT_MSG", (data) => {
                if (data.senderId !== state.myId) {
                    renderMessage(data.text, 'other', data.senderNick);
                }
            });

            roomChannel.on("LEAVE_ROOM", (data) => {
                if (data.senderId !== state.myId) {
                    renderSystemMessage(`${data.senderNick} 님이 퇴장하셨습니다.`);
                }
            });

            refreshIcebreaker();
            renderSystemMessage('다른 기기와 전 세계 실시간 연결되었습니다!');
        }

        // --- 메시지 전송 ---
        function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text || !roomChannel) return;

            roomChannel.emit("CHAT_MSG", {
                senderId: state.myId,
                senderNick: state.myNickname,
                text: text
            });

            renderMessage(text, 'my', state.myNickname);
            inputEl.value = '';
        }

        function renderMessage(text, type, senderNick) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            if (type === 'other') {
                const senderDiv = document.createElement('div');
                senderDiv.className = 'msg-sender';
                senderDiv.innerText = senderNick;
                msgDiv.appendChild(senderDiv);
            }

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'msg-bubble';
            bubbleDiv.innerText = text;
            msgDiv.appendChild(bubbleDiv);

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function renderSystemMessage(text) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message system';
            msgDiv.innerHTML = `<span class="system-text">${text}</span>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function refreshIcebreaker() {
            const randomTopic = ICEBREAKERS[Math.floor(Math.random() * ICEBREAKERS.length)];
            document.getElementById('icebreaker-text').innerText = randomTopic;
        }

        function leaveChat() {
            if (confirm('정말 채팅방을 나가시겠습니까?')) {
                if (roomChannel) {
                    roomChannel.emit("LEAVE_ROOM", {
                        senderId: state.myId,
                        senderNick: state.myNickname
                    });
                }
                showView('view-lobby');
            }
        }
    </script>
</body>
</html>
