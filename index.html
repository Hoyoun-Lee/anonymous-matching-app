<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 창의 컴퓨팅 - 1:1 실시간 매칭 앱</title>
    <!-- Socket.io CDN -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --chat-my-bg: #4F46E5;
            --chat-my-text: #FFFFFF;
            --chat-other-bg: #E5E7EB;
            --chat-other-text: #1F2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
        .container { width: 100%; max-width: 440px; background-color: var(--card-bg); border-radius: 18px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); overflow: hidden; display: flex; flex-direction: column; height: 85vh; max-height: 680px; }
        header { background-color: var(--primary-color); color: white; padding: 1.2rem; text-align: center; font-weight: 700; font-size: 1.15rem; }
        .subtitle { font-size: 0.75rem; font-weight: 400; opacity: 0.85; margin-top: 0.2rem; }
        .view { display: none; flex-direction: column; height: 100%; padding: 1.5rem; overflow-y: auto; }
        .view.active { display: flex; }
        .lobby-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; text-align: center; }
        .lobby-desc { color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; line-height: 1.4; }
        .nickname-box { background-color: #EEF2FF; border: 1px solid #C7D2FE; padding: 1.2rem; border-radius: 14px; text-align: center; margin-bottom: 1.5rem; }
        .nickname-label { font-size: 0.78rem; color: #4338CA; font-weight: 600; margin-bottom: 0.3rem; }
        .nickname-value { font-size: 1.25rem; font-weight: 700; color: #312E81; }
        .btn-start { background-color: var(--primary-color); color: white; border: none; padding: 1rem; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: auto; }
        .waiting-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .spinner { width: 52px; height: 52px; border: 5px solid var(--border-color); border-top: 5px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1.5rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .waiting-status { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; }
        .waiting-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; }
        .btn-cancel { background-color: #EF4444; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-top: 2rem; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); margin-bottom: 0.75rem; }
        .btn-leave { background-color: #FEF2F2; color: #EF4444; border: 1px solid #FCA5A5; padding: 0.35rem 0.75rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 0.2rem; margin-bottom: 0.75rem; }
        .message { display: flex; flex-direction: column; max-width: 80%; }
        .message.my { align-self: flex-end; }
        .message.other { align-self: flex-start; }
        .message.system { align-self: center; max-width: 100%; margin: 0.4rem 0; }
        .system-text { background-color: #F3F4F6; color: var(--text-muted); font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 12px; }
        .msg-sender { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 0.15rem; margin-left: 0.2rem; }
        .msg-bubble { padding: 0.6rem 0.9rem; border-radius: 14px; font-size: 0.88rem; word-break: break-word; line-height: 1.4; }
        .message.my .msg-bubble { background-color: var(--chat-my-bg); color: var(--chat-my-text); border-bottom-right-radius: 2px; }
        .message.other .msg-bubble { background-color: var(--chat-other-bg); color: var(--chat-other-text); border-bottom-left-radius: 2px; }
        .chat-input-container { display: flex; gap: 0.5rem; }
        .chat-input { flex: 1; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 24px; outline: none; font-size: 0.9rem; }
        .btn-send { background-color: var(--primary-color); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            익명 실시간 1:1 매칭
            <div class="subtitle">AI 창의 컴퓨팅 과제</div>
        </header>

        <!-- LOBBY VIEW -->
        <div id="view-lobby" class="view active">
            <h2 class="lobby-title">새로운 상대를 만나요</h2>
            <p class="lobby-desc">서로 다른 네트워크에서도 중앙 서버 대기열을 거쳐<br>100% 실시간 1대1 대화로 연결됩니다.</p>

            <div class="nickname-box">
                <div class="nickname-label">당신의 익명 닉네임</div>
                <div id="user-nickname" class="nickname-value">생성 중...</div>
            </div>

            <button class="btn-start" onclick="startMatching()">대기열 입장하기</button>
        </div>

        <!-- WAITING VIEW -->
        <div id="view-waiting" class="view">
            <div class="waiting-container">
                <div class="spinner"></div>
                <div class="waiting-status" id="waiting-status-text">서버 연결 중...</div>
                <p class="waiting-desc">Render 서버가 잠들어 있다면 깨어나는 데<br>약 30~50초가 걸릴 수 있습니다.</p>
                <button class="btn-cancel" onclick="cancelMatching()">매칭 취소</button>
            </div>
        </div>

        <!-- CHAT VIEW -->
        <div id="view-chat" class="view">
            <div class="chat-header">
                <div class="chat-room-info" id="chat-partner-info">🟢 1:1 대화 중</div>
                <button class="btn-leave" onclick="leaveChat()">방 나가기</button>
            </div>

            <div id="chat-messages" class="chat-messages"></div>

            <div class="chat-input-container">
                <input type="text" id="chat-input" class="chat-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://matching-server-j3h4.onrender.com";
        const socket = io(SERVER_URL, { autoConnect: false });

        const ADJECTIVES = ['친절한', '스마트한', '즐거운', '창의적인', '용감한', '행복한', '빛나는', '따뜻한'];
        const ANIMALS = ['사자', '호랑이', '토끼', '고양이', '강아지', '돌고래', '올빼미', '판다'];

        let myNickname = '';
        let currentRoomId = null;

        window.onload = () => {
            myNickname = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)] + ' ' + ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
            document.getElementById('user-nickname').innerText = myNickname;
        };

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function startMatching() {
            showView('view-waiting');
            document.getElementById('waiting-status-text').innerText = "서버 연결 확인 중...";

            if (!socket.connected) {
                socket.connect();
            } else {
                socket.emit('join_queue', { nickname: myNickname });
                document.getElementById('waiting-status-text').innerText = "매칭 상대 탐색 중...";
            }
        }

        socket.on('connect', () => {
            document.getElementById('waiting-status-text').innerText = "매칭 상대 탐색 중...";
            socket.emit('join_queue', { nickname: myNickname });
        });

        function cancelMatching() {
            socket.emit('cancel_queue');
            showView('view-lobby');
        }

        socket.on('matched', (data) => {
            currentRoomId = data.roomId;
            document.getElementById('chat-messages').innerHTML = '';
            document.getElementById('chat-partner-info').innerText = `🟢 ${data.partnerNick} 님과 대화 중`;
            showView('view-chat');
            renderSystemMessage(`${data.partnerNick} 님과 연결되었습니다!`);
        });

        function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text || !currentRoomId) return;

            // 내가 보낸 메시지 화면 출력
            renderMessage(text, 'my', myNickname);

            // 서버로 전달 (상대방에게만 전달됨)
            socket.emit('send_msg', {
                roomId: currentRoomId,
                text: text,
                senderNick: myNickname
            });

            inputEl.value = '';
        }

        socket.on('receive_msg', (data) => {
            renderMessage(data.text, 'other', data.senderNick);
        });

        function renderMessage(text, type, senderNick) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            if (type === 'other') {
                const senderDiv = document.createElement('div');
                senderDiv.className = 'msg-sender';
                senderDiv.innerText = senderNick;
                msgDiv.appendChild(senderDiv);
            }

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'msg-bubble';
            bubbleDiv.innerText = text;
            msgDiv.appendChild(bubbleDiv);

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function renderSystemMessage(text) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message system';
            msgDiv.innerHTML = `<span class="system-text">${text}</span>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function leaveChat() {
            if (confirm('정말 채팅방을 나가시겠습니까?')) {
                location.reload();
            }
        }
    </script>
</body>
</html>
