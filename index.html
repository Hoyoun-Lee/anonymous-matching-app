<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명 실시간 매칭 앱</title>
    <!-- PeerJS P2P Realtime Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --chat-my-bg: #4F46E5;
            --chat-my-text: #FFFFFF;
            --chat-other-bg: #E5E7EB;
            --chat-other-text: #1F2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.25rem;
            text-align: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .view.active {
            display: flex;
        }

        .lobby-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .lobby-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .nickname-box {
            background-color: #EEF2FF;
            border: 1px solid #C7D2FE;
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .nickname-label {
            font-size: 0.8rem;
            color: #4338CA;
            font-weight: 600;
        }

        .nickname-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #312E81;
        }

        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .btn-mode {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-mode:hover {
            border-color: var(--primary-color);
        }

        .btn-mode.selected {
            border-color: var(--primary-color);
            background-color: #EEF2FF;
        }

        .mode-info h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .mode-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-start {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: auto;
        }

        .waiting-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--border-color);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-cancel {
            background-color: #EF4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0.75rem;
        }

        .btn-leave {
            background-color: #F3F4F6;
            color: #EF4444;
            border: 1px solid #FCA5A5;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.my { align-self: flex-end; }
        .message.other { align-self: flex-start; }
        .message.system { align-self: center; max-width: 100%; margin: 0.5rem 0; }

        .system-text {
            background-color: #F3F4F6;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
        }

        .msg-sender {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 0.1rem;
        }

        .msg-bubble {
            padding: 0.6rem 0.9rem;
            border-radius: 14px;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .message.my .msg-bubble {
            background-color: var(--chat-my-bg);
            color: var(--chat-my-text);
        }

        .message.other .msg-bubble {
            background-color: var(--chat-other-bg);
            color: var(--chat-other-text);
        }

        .chat-input-container {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            outline: none;
        }

        .btn-send {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>익명 실시간 매칭</header>

        <!-- LOBBY VIEW -->
        <div id="view-lobby" class="view active">
            <h2 class="lobby-title">새로운 상대를 만나보세요</h2>
            <p class="lobby-desc">글로벌 실시간 대화 웹 App</p>

            <div class="nickname-box">
                <div class="nickname-label">당신의 익명 닉네임</div>
                <div id="user-nickname" class="nickname-value">생성 중...</div>
            </div>

            <div class="mode-selection">
                <div class="btn-mode selected" data-mode="1v1" onclick="selectMode('1v1')">
                    <div class="mode-info">
                        <h4>1 : 1 매칭</h4>
                        <p>1명과 1대1로 대화합니다.</p>
                    </div>
                    <span>👤👤</span>
                </div>
                <div class="btn-mode" data-mode="3group" onclick="selectMode('3group')">
                    <div class="mode-info">
                        <h4>3인 그룹 매칭</h4>
                        <p>총 3명이서 대화합니다.</p>
                    </div>
                    <span>👥👥</span>
                </div>
                <div class="btn-mode" data-mode="4group" onclick="selectMode('4group')">
                    <div class="mode-info">
                        <h4>4인 그룹 매칭</h4>
                        <p>총 4명이서 대화합니다.</p>
                    </div>
                    <span>👨‍👩‍👧‍👦</span>
                </div>
            </div>

            <button class="btn-start" onclick="startMatching()">대기열 입장하기</button>
        </div>

        <!-- WAITING VIEW -->
        <div id="view-waiting" class="view">
            <div class="waiting-container">
                <div class="spinner"></div>
                <div style="font-size:1.2rem; font-weight:700;" id="waiting-status">매칭 상대 탐색 중...</div>
                <p style="color:gray; font-size:0.9rem; margin-top:0.5rem;">다른 기기에서 대기 중인 사용자를 연결하고 있습니다.</p>
                <button class="btn-cancel" onclick="cancelMatching()">매칭 취소</button>
            </div>
        </div>

        <!-- CHAT VIEW -->
        <div id="view-chat" class="view">
            <div class="chat-header">
                <div id="chat-room-title" style="font-size:0.9rem; font-weight:600;">실시간 채팅방</div>
                <button class="btn-leave" onclick="leaveChat()">방 나가기</button>
            </div>

            <div id="chat-messages" class="chat-messages"></div>

            <div class="chat-input-container">
                <input type="text" id="chat-input" class="chat-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="btn-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const ADJECTIVES = ['행복한', '즐거운', '상상하는', '창의적인', '스마트한', '용감한', '친절한'];
        const ANIMALS = ['사자', '호랑이', '토끼', '고양이', '강아지', '펭귄', '돌고래'];

        let peer = null;
        let connections = [];
        let myNickname = '';
        let selectedMode = '1v1';
        let isMatching = false;
        let retryTimer = null;

        window.onload = () => {
            myNickname = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)] + ' ' + ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
            document.getElementById('user-nickname').innerText = myNickname;
        };

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function selectMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.btn-mode').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.mode === mode);
            });
        }

        // --- 매칭 로직 (PeerJS P2P 메커니즘) ---
        function startMatching() {
            showView('view-waiting');
            isMatching = true;

            // 공용 PeerJS 시그널 서버에 접속
            peer = new Peer();

            peer.on('open', (id) => {
                if (!isMatching) return;
                tryConnectToHost();
            });

            // 누군가 나에게 연결 요청을 했을 때 (내가 방장 역할이 될 때)
            peer.on('connection', (conn) => {
                setupConnection(conn);
                if (isMatching) {
                    isMatching = false;
                    clearTimeout(retryTimer);
                    enterChatRoom();
                }
            });

            peer.on('error', (err) => {
                if (isMatching) {
                    retryTimer = setTimeout(tryConnectToHost, 1000);
                }
            });
        }

        function tryConnectToHost() {
            if (!isMatching) return;

            // 선택한 모드별 채널 ID 생성
            const hostId = 'app_room_host_' + selectedMode;
            const conn = peer.connect(hostId);

            conn.on('open', () => {
                isMatching = false;
                setupConnection(conn);
                enterChatRoom();
            });

            // 기존 방장이 없으면 스스로 방장(Host) ID로 재접속
            retryTimer = setTimeout(() => {
                if (isMatching && peer && !peer.destroyed) {
                    peer.destroy();
                    peer = new Peer('app_room_host_' + selectedMode);
                    peer.on('open', () => {
                        document.getElementById('waiting-status').innerText = "상대방 접속 대기 중...";
                    });
                    peer.on('connection', (conn) => {
                        setupConnection(conn);
                        isMatching = false;
                        enterChatRoom();
                    });
                }
            }, 2500);
        }

        function setupConnection(conn) {
            connections.push(conn);

            conn.on('data', (data) => {
                if (data.type === 'chat') {
                    renderMessage(data.text, 'other', data.nickname);
                } else if (data.type === 'leave') {
                    renderSystemMessage(`${data.nickname} 님이 퇴장하셨습니다.`);
                }
            });

            conn.on('close', () => {
                renderSystemMessage(`상대방과의 연결이 끊어졌습니다.`);
            });
        }

        // --- 매칭 취소 ---
        function cancelMatching() {
            isMatching = false;
            clearTimeout(retryTimer);
            if (peer) {
                peer.destroy();
                peer = null;
            }
            connections = [];
            showView('view-lobby');
        }

        // --- 채팅 시스템 ---
        function enterChatRoom() {
            showView('view-chat');
            document.getElementById('chat-messages').innerHTML = '';
            
            const modeName = selectedMode === '1v1' ? '1대1' : (selectedMode === '3group' ? '3인 그룹' : '4인 그룹');
            document.getElementById('chat-room-title').innerText = `${modeName} 실시간 채팅방`;

            renderSystemMessage('상대방과 실시간 연결되었습니다!');
        }

        function sendMessage() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;

            // 나에게 연결된 모든 사용자에게 메시지 전송
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send({
                        type: 'chat',
                        text: text,
                        nickname: myNickname
                    });
                }
            });

            renderMessage(text, 'my', myNickname);
            inputEl.value = '';
        }

        function renderMessage(text, type, senderNick) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            if (type === 'other') {
                const senderDiv = document.createElement('div');
                senderDiv.className = 'msg-sender';
                senderDiv.innerText = senderNick;
                msgDiv.appendChild(senderDiv);
            }

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'msg-bubble';
            bubbleDiv.innerText = text;
            msgDiv.appendChild(bubbleDiv);

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function renderSystemMessage(text) {
            const container = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message system';
            msgDiv.innerHTML = `<span class="system-text">${text}</span>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function leaveChat() {
            if (confirm('정말 채팅방을 나가시겠습니까?')) {
                connections.forEach(conn => {
                    if (conn.open) {
                        conn.send({ type: 'leave', nickname: myNickname });
                        conn.close();
                    }
                });
                cancelMatching();
            }
        }
    </script>
</body>
</html>
