<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 창의컴퓨팅 익명 매칭 앱</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PeerJS library CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <!-- Font setup -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-6 transition-colors duration-200">

  <!-- Main Glassmorphism Card Container -->
  <div id="app" class="w-full max-w-md bg-slate-800/90 border border-slate-700/60 backdrop-blur-md rounded-2xl shadow-2xl flex flex-col overflow-hidden h-[90vh] max-h-[780px] relative">

    <!-- App Header -->
    <header class="bg-slate-900/80 px-5 py-3.5 border-b border-slate-700/60 flex justify-between items-center z-10">
      <div class="flex items-center gap-2.5">
        <div class="p-2 bg-indigo-600/30 rounded-xl text-indigo-400 border border-indigo-500/30">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-100 leading-tight">창의컴퓨팅 매칭</h1>
          <p id="userNicknameBadge" class="text-xs text-indigo-400 font-medium truncate max-w-[150px]">프로필 생성 중...</p>
        </div>
      </div>
      
      <!-- Network Status Indicator -->
      <div id="statusBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-700/60 text-slate-400 border border-slate-600/40">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span id="statusText">대기 중</span>
      </div>
    </header>

    <!-- VIEW 1: LOBBY -->
    <main id="viewLobby" class="flex-1 flex flex-col justify-between p-6">
      <div class="space-y-6 my-auto text-center">
        <!-- Banner Illustration -->
        <div class="w-20 h-20 mx-auto bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-3xl flex items-center justify-center shadow-lg shadow-indigo-500/20 transform hover:scale-105 transition-transform duration-300">
          <i data-lucide="users" class="w-10 h-10 text-white"></i>
        </div>
        
        <div>
          <h2 class="text-xl font-bold text-white mb-1.5">실시간 1:1 익명 랜덤 채팅</h2>
          <p class="text-sm text-slate-400 leading-relaxed">
            학번이나 이름 공개 없이 안전하게 대화해보세요.<br>
            서로 다른 와이파이/네트워크에서도 연결됩니다!
          </p>
        </div>

        <!-- Nickname Box -->
        <div class="bg-slate-900/60 border border-slate-700/80 rounded-xl p-4 flex items-center justify-between shadow-inner">
          <div class="text-left">
            <span class="text-xs text-slate-400 block font-medium mb-0.5">나의 임시 닉네임</span>
            <span id="lobbyNickname" class="text-base font-bold text-indigo-300">...</span>
          </div>
          <button id="btnRefreshNickname" class="p-2 hover:bg-slate-700/60 rounded-lg text-slate-400 hover:text-white transition-colors" title="닉네임 변경">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Server/Peer Info Box -->
        <div class="text-xs text-slate-500 bg-slate-900/30 p-2.5 rounded-lg border border-slate-800 flex items-center justify-center gap-2">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>P2P 분산 탐색 시그널링 탑재</span>
        </div>
      </div>

      <!-- Enter Queue Button -->
      <button id="btnEnterQueue" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-base">
        <i data-lucide="zap" class="w-5 h-5"></i>
        <span>대기열 입장하기</span>
      </button>
    </main>

    <!-- VIEW 2: WAITING QUEUE -->
    <main id="viewWaiting" class="hidden flex-1 flex flex-col justify-between p-6 text-center">
      <div class="my-auto space-y-6">
        <!-- Radar Scanning Animation -->
        <div class="relative w-28 h-28 mx-auto flex items-center justify-center">
          <div class="absolute inset-0 rounded-full border-2 border-indigo-500/20 animate-ping"></div>
          <div class="absolute inset-2 rounded-full border border-indigo-500/40 animate-pulse"></div>
          <div class="w-20 h-20 bg-slate-900/90 border border-indigo-500/50 rounded-full flex items-center justify-center shadow-lg shadow-indigo-500/30">
            <i data-lucide="radar" class="w-10 h-10 text-indigo-400 animate-spin" style="animation-duration: 4s;"></i>
          </div>
        </div>

        <div>
          <h2 class="text-xl font-bold text-white mb-2">대화 상대를 찾는 중...</h2>
          <p id="queueStatusText" class="text-sm text-slate-400">
            분산 대기열 슬롯을 확인하는 중입니다...
          </p>
        </div>

        <!-- Slot Inspection Indicator -->
        <div class="bg-slate-900/60 border border-slate-700/80 rounded-xl p-3 text-xs text-slate-400 flex items-center justify-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
          <span id="slotInfoText">슬롯 검색 시작 중</span>
        </div>
      </div>

      <!-- Cancel Button -->
      <button id="btnCancelQueue" class="w-full py-3.5 bg-slate-700/80 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-600/60 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <i data-lucide="x-circle" class="w-5 h-5 text-rose-400"></i>
        <span>매칭 취소</span>
      </button>
    </main>

    <!-- VIEW 3: ACTIVE CHAT -->
    <main id="viewChat" class="hidden flex-1 flex flex-col overflow-hidden bg-slate-900/40">
      <!-- Icebreaker Header Bar -->
      <div class="bg-slate-800/80 border-b border-slate-700/60 p-3 px-4 flex items-center justify-between gap-2 shadow-sm">
        <div class="flex items-center gap-2 overflow-hidden text-xs text-slate-300">
          <i data-lucide="lightbulb" class="w-4 h-4 text-amber-400 shrink-0"></i>
          <span id="icebreakerText" class="truncate font-medium">아이스브레이커 추천 주제를 불러오는 중...</span>
        </div>
        <button id="btnRefreshTopic" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-amber-300 transition-colors shrink-0" title="주제 변경">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Chat Messages Container -->
      <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3.5 text-sm">
        <!-- Messages rendered dynamically here -->
      </div>

      <!-- Input Bar -->
      <div class="p-3 bg-slate-900/90 border-t border-slate-700/60 flex items-center gap-2">
        <button id="btnLeaveChat" class="p-2.5 bg-slate-800 hover:bg-rose-950/40 hover:text-rose-400 text-slate-400 rounded-xl border border-slate-700/80 transition-colors" title="채팅 나가기">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
        <input 
          type="text" 
          id="chatInput" 
          placeholder="메시지를 입력하세요..." 
          class="flex-1 bg-slate-800/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500/80 text-sm"
          maxlength="500"
        />
        <button id="btnSendMessage" class="p-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-xl shadow-md transition-all">
          <i data-lucide="send" class="w-5 h-5"></i>
        </button>
      </div>
    </main>

  </div>

  <script>
    /* ====================================================================
       APP STATE & GLOBAL CONFIGURATION
       ==================================================================== */
    const CONFIG = {
      // Multiple STUN servers ensure NAT traversal across different Wi-Fi / Mobile networks
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ],
      // Matchmaker room slots pool
      PREFIX: 'aicomp_matching_slot_',
      MAX_SLOTS: 8,
      SLOT_POLL_INTERVAL: 1500, // 1.5 seconds per slot check
      HEARTBEAT_INTERVAL: 3000
    };

    // Korean Nickname generator words
    const ADJECTIVES = ['행복한', '즐거운', '상상하는', '호기심많은', '창의적인', '용감한', '친절한', '빛나는', '차분한', '지혜로운'];
    const NOUNS = ['사자', '돌고래', '알파카', '부엉이', '호랑이', '탐험가', '연구원', '개발자', '크리에이터', '멘토'];

    // Random Icebreaker Topics
    const ICEBREAKERS = [
      "요즘 즐겨보는 유튜브 채널이나 시리즈가 있으신가요?",
      "오늘 있었던 소소한 기분 좋은 일 하나만 공유해주세요!",
      "시험 끝나고 가장 하고 싶은 것은 무엇인가요?",
      "자주 가는 학교 근처 카페나 맛집 추천해주세요!",
      "가장 좋아하는 취미나 스트레스 해소법은 무엇인가요?",
      "다시 가보고 싶은 제일 기억에 남는 여행지는 어디인가요?",
      "민트초코 vs 민초안먹음, 당신의 취향은?",
      "인생 영화나 추천하고 싶은 음악 앨범이 있으신가요?"
    ];

    // State Variables
    let state = {
      view: 'lobby', // 'lobby', 'waiting', 'chat'
      myNickname: '',
      peer: null,
      peerId: null,
      conn: null,
      currentSlotIndex: 0,
      isHost: false,
      matchmakerTimer: null,
      heartbeatTimer: null,
      isCancelled: false
    };

    /* ====================================================================
       HELPER FUNCTIONS
       ==================================================================== */
    function generateRandomNickname() {
      const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
      const noun = NOUNS[Math.floor(Math.random() * NOUNS.length)];
      const num = Math.floor(Math.random() * 90 + 10);
      return `${adj} ${noun} ${num}`;
    }

    function getRandomIcebreaker() {
      return ICEBREAKERS[Math.floor(Math.random() * ICEBREAKERS.length)];
    }

    function formatTime(date = new Date()) {
      return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    /* UI View Controller */
    function setView(viewName) {
      state.view = viewName;
      document.getElementById('viewLobby').classList.toggle('hidden', viewName !== 'lobby');
      document.getElementById('viewWaiting').classList.toggle('hidden', viewName !== 'waiting');
      document.getElementById('viewChat').classList.toggle('hidden', viewName !== 'chat');

      const statusBadge = document.getElementById('statusBadge');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (viewName === 'lobby') {
        statusDot.className = 'w-2 h-2 rounded-full bg-slate-500';
        statusText.innerText = '대기 중';
      } else if (viewName === 'waiting') {
        statusDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
        statusText.innerText = '매칭 중';
      } else if (viewName === 'chat') {
        statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        statusText.innerText = '1:1 대화 중';
      }
    }

    /* Add Message to Chat Screen */
    function appendMessage({ type, text, sender, time }) {
      const chatContainer = document.getElementById('chatMessages');
      const messageEl = document.createElement('div');

      if (type === 'system') {
        messageEl.className = 'flex justify-center my-2';
        messageEl.innerHTML = `
          <div class="bg-slate-800/80 border border-slate-700/60 text-slate-400 text-xs px-3 py-1.5 rounded-full font-medium shadow-sm">
            ${text}
          </div>
        `;
      } else if (type === 'my') {
        messageEl.className = 'flex flex-col items-end my-1';
        messageEl.innerHTML = `
          <div class="flex items-end gap-1.5 max-w-[80%]">
            <span class="text-[10px] text-slate-500 mb-1">${time}</span>
            <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-xs px-3.5 py-2 text-sm shadow-md break-words">
              ${escapeHTML(text)}
            </div>
          </div>
        `;
      } else if (type === 'other') {
        messageEl.className = 'flex flex-col items-start my-1';
        messageEl.innerHTML = `
          <span class="text-[11px] text-slate-400 mb-0.5 ml-1 font-medium">${escapeHTML(sender || '상대방')}</span>
          <div class="flex items-end gap-1.5 max-w-[80%]">
            <div class="bg-slate-800 border border-slate-700/80 text-slate-100 rounded-2xl rounded-tl-xs px-3.5 py-2 text-sm shadow-md break-words">
              ${escapeHTML(text)}
            </div>
            <span class="text-[10px] text-slate-500 mb-1">${time}</span>
          </div>
        `;
      }

      chatContainer.appendChild(messageEl);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    /* ====================================================================
       MATCHMAKING ENGINE (PeerJS Distributed Slot Polling)
       ==================================================================== */
    
    function startMatchmaking() {
      state.isCancelled = false;
      state.currentSlotIndex = Math.floor(Math.random() * CONFIG.MAX_SLOTS);
      setView('waiting');
      tryClaimOrConnectSlot();
    }

    function stopMatchmaking() {
      state.isCancelled = true;
      if (state.matchmakerTimer) clearTimeout(state.matchmakerTimer);
      if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
      
      if (state.conn) {
        state.conn.close();
        state.conn = null;
      }
      if (state.peer) {
        state.peer.destroy();
        state.peer = null;
      }

      setView('lobby');
    }

    /* Core Matchmaking Algorithm */
    function tryClaimOrConnectSlot() {
      if (state.isCancelled) return;

      const targetSlotId = CONFIG.PREFIX + state.currentSlotIndex;
      const slotInfoText = document.getElementById('slotInfoText');
      if (slotInfoText) {
        slotInfoText.innerText = `슬롯 #${state.currentSlotIndex + 1} 검색 및 매칭 시도 중...`;
      }

      // Clean up old peer instance
      if (state.peer) {
        state.peer.destroy();
        state.peer = null;
      }

      // 1. First, try to join as a Client to an existing Host at targetSlotId
      const clientPeer = new Peer({
        config: { iceServers: CONFIG.iceServers },
        debug: 0
      });

      let attemptedConnect = false;

      clientPeer.on('open', (id) => {
        if (state.isCancelled) return;
        state.peer = clientPeer;

        // Try connecting to the Host waiting on this slot
        const conn = clientPeer.connect(targetSlotId, {
          reliable: true,
          metadata: { nickname: state.myNickname }
        });

        attemptedConnect = true;

        const connectionTimeout = setTimeout(() => {
          if (!state.conn && !state.isCancelled) {
            // Connection failed/timed out: Slot is empty. Become the Host on this slot!
            conn.close();
            becomeSlotHost(targetSlotId);
          }
        }, 1200);

        conn.on('open', () => {
          clearTimeout(connectionTimeout);
          if (state.isCancelled) {
            conn.close();
            return;
          }
          // Connected successfully to a waiting Host!
          setupActiveConnection(conn, false);
        });

        conn.on('error', () => {
          clearTimeout(connectionTimeout);
          if (!state.conn && !state.isCancelled) {
            becomeSlotHost(targetSlotId);
          }
        });
      });

      clientPeer.on('error', (err) => {
        // If Peer creation fails or slot unavailable, advance to next slot
        if (!state.conn && !state.isCancelled) {
          moveToNextSlot();
        }
      });
    }

    /* Become Host on a specific slot */
    function becomeSlotHost(slotId) {
      if (state.isCancelled) return;

      if (state.peer) {
        state.peer.destroy();
        state.peer = null;
      }

      // Try creating peer with fixed slotId
      const hostPeer = new Peer(slotId, {
        config: { iceServers: CONFIG.iceServers },
        debug: 0
      });

      hostPeer.on('open', (id) => {
        if (state.isCancelled) {
          hostPeer.destroy();
          return;
        }
        state.peer = hostPeer;
        state.isHost = true;

        const slotInfoText = document.getElementById('slotInfoText');
        if (slotInfoText) {
          slotInfoText.innerText = `슬롯 #${state.currentSlotIndex + 1} 대기 등록 완료. 상대방 기다리는 중...`;
        }

        // Host timeout: If nobody joins this slot within 6 seconds, move to another slot to prevent deadlock
        state.matchmakerTimer = setTimeout(() => {
          if (!state.conn && !state.isCancelled) {
            moveToNextSlot();
          }
        }, 6000);
      });

      // Handle incoming client connection
      hostPeer.on('connection', (conn) => {
        if (state.matchmakerTimer) clearTimeout(state.matchmakerTimer);
        if (state.isCancelled) {
          conn.close();
          return;
        }
        setupActiveConnection(conn, true);
      });

      // Slot is already occupied by another host
      hostPeer.on('error', (err) => {
        if (!state.conn && !state.isCancelled) {
          moveToNextSlot();
        }
      });
    }

    function moveToNextSlot() {
      if (state.isCancelled) return;
      state.currentSlotIndex = (state.currentSlotIndex + 1) % CONFIG.MAX_SLOTS;
      state.matchmakerTimer = setTimeout(() => {
        tryClaimOrConnectSlot();
      }, 500);
    }

    /* Set up established Data Connection */
    function setupActiveConnection(conn, isHost) {
      state.conn = conn;
      state.isHost = isHost;

      // Clear matchmaker timers
      if (state.matchmakerTimer) clearTimeout(state.matchmakerTimer);

      conn.on('open', () => {
        setView('chat');
        document.getElementById('chatMessages').innerHTML = '';

        // Exchange initial handshake
        conn.send({
          type: 'handshake',
          nickname: state.myNickname
        });

        appendMessage({
          type: 'system',
          text: '🎉 상대방과 연결되었습니다! 매너 있는 대화를 나눠주세요.'
        });

        // Initialize Icebreaker topic
        document.getElementById('icebreakerText').innerText = getRandomIcebreaker();

        // Start periodic heartbeat
        startHeartbeat();
      });

      conn.on('data', (data) => {
        if (!data || typeof data !== 'object') return;

        if (data.type === 'chat') {
          appendMessage({
            type: 'other',
            text: data.text,
            sender: data.sender || '상대방',
            time: data.time || formatTime()
          });
        } else if (data.type === 'handshake') {
          conn.peerNickname = data.nickname;
        } else if (data.type === 'ping') {
          conn.send({ type: 'pong' });
        }
      });

      conn.on('close', () => {
        handleDisconnect('상대방이 대화방을 나갔습니다.');
      });

      conn.on('error', () => {
        handleDisconnect('연결에 오류가 발생하여 종료되었습니다.');
      });
    }

    function startHeartbeat() {
      if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
      state.heartbeatTimer = setInterval(() => {
        if (state.conn && state.conn.open) {
          state.conn.send({ type: 'ping' });
        }
      }, CONFIG.HEARTBEAT_INTERVAL);
    }

    function handleDisconnect(reason) {
      if (state.view === 'chat') {
        appendMessage({
          type: 'system',
          text: `⚠️ ${reason}`
        });
      }
      if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
      state.conn = null;
    }

    /* Send Chat Message */
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      
      if (!text || !state.conn || !state.conn.open) return;

      const timeStr = formatTime();

      // Local Render
      appendMessage({
        type: 'my',
        text: text,
        time: timeStr
      });

      // Send to Peer
      state.conn.send({
        type: 'chat',
        text: text,
        sender: state.myNickname,
        time: timeStr
      });

      input.value = '';
      input.focus();
    }

    /* ====================================================================
       EVENT LISTENERS & INITIALIZATION
       ==================================================================== */
    window.onload = function() {
      // 1. Initialize Icons
      lucide.createIcons();

      // 2. Initial Nickname Generation
      state.myNickname = generateRandomNickname();
      document.getElementById('lobbyNickname').innerText = state.myNickname;
      document.getElementById('userNicknameBadge').innerText = state.myNickname;

      // 3. Refresh Nickname Button
      document.getElementById('btnRefreshNickname').addEventListener('click', () => {
        state.myNickname = generateRandomNickname();
        document.getElementById('lobbyNickname').innerText = state.myNickname;
        document.getElementById('userNicknameBadge').innerText = state.myNickname;
      });

      // 4. Queue Control Buttons
      document.getElementById('btnEnterQueue').addEventListener('click', () => {
        startMatchmaking();
      });

      document.getElementById('btnCancelQueue').addEventListener('click', () => {
        stopMatchmaking();
      });

      // 5. Chat Controls
      document.getElementById('btnSendMessage').addEventListener('click', sendMessage);
      
      document.getElementById('chatInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });

      document.getElementById('btnRefreshTopic').addEventListener('click', () => {
        document.getElementById('icebreakerText').innerText = getRandomIcebreaker();
      });

      document.getElementById('btnLeaveChat').addEventListener('click', () => {
        if (confirm('대화방을 나갈까요?')) {
          stopMatchmaking();
        }
      });
    };
  </script>
</body>
</html>
